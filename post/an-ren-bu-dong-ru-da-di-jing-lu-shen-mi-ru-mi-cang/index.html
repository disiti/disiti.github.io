		<div class="post-content"><p><img src="https://arkben.053200.xyz/post-images/1774186136569.JPG" alt="" /><br />
青岛湛山寺，是国内最年轻的天台宗道场，始建于1931年，1934年动工，1945年全部竣工。<br />
湛山寺由天台宗大德倓虚大师创建，虚云长老也曾在这里讲学，两位高僧共护这座山海古刹。<br />
近代大德明哲张老是湛山寺的中兴祖师，天台宗风在此传承。<br />
天台宗讲究<strong>教观总持</strong>，以教明理，以观修行，明理与实修并行，不偏不废。</p>
